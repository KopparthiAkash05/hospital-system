{% extends 'base.html' %}

{% block title %}Doctor Profile Settings - MediCare Hospital{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-cog"></i>
            <h2>Doctor Profile Settings</h2>
            <p>Update your clinic details and availability</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" value="{{ doctor.name }}" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" name="phone" id="phone" value="{{ doctor.phone }}" required>
            </div>

            <div class="form-group">
                <label for="address">
                    <i class="fas fa-map-marker-alt"></i> Clinic Address
                </label>
                <input type="text" name="address" id="address" value="{{ doctor.address or '' }}" placeholder="Enter full clinic address">
                <small class="form-hint">Coordinates will be updated automatically for the Nearby Doctors feature.</small>
            </div>

            <div class="form-group">
                <label for="available_slots">
                    <i class="fas fa-clock"></i> Available Slots
                </label>
                <input type="text" name="available_slots" id="available_slots" value="{{ doctor.available_slots or '' }}" placeholder="e.g., Mon-Fri: 10AM-5PM">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
