{% extends "base.html" %}

{% block title %}Settings - Patient Dashboard{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="container">
        <div class="dashboard-header">
            <h1><i class="fas fa-cog"></i> Account Settings</h1>
            <p>Update your personal details and password</p>
        </div>

        <div class="dashboard-grid">
            <!-- Profile Settings -->
            <div class="dashboard-section">
                <h2><i class="fas fa-user-edit"></i> Profile Details</h2>
                <form method="POST" class="settings-form">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" name="name" id="name" value="{{ patient.name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" id="email" value="{{ patient.email }}" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                            <input type="text" name="phone" id="phone" value="{{ patient.phone }}" required>
                        </div>
                        <div class="form-group">
                            <label for="age"><i class="fas fa-birthday-cake"></i> Age</label>
                            <input type="number" name="age" id="age" value="{{ patient.age }}" required min="1" max="120">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address"><i class="fas fa-map-marker-alt"></i> Address</label>
                        <textarea name="address" id="address" rows="3">{{ patient.address or '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Profile
                    </button>
                </form>
            </div>

            <!-- Password Settings -->
            <div class="dashboard-section">
                <h2><i class="fas fa-lock"></i> Change Password</h2>
                <form method="POST" class="settings-form">
                    <!-- Hidden fields to pass profile data again so it doesn't get lost -->
                    <input type="hidden" name="name" value="{{ patient.name }}">
                    <input type="hidden" name="email" value="{{ patient.email }}">
                    <input type="hidden" name="phone" value="{{ patient.phone }}">
                    <input type="hidden" name="age" value="{{ patient.age }}">
                    <input type="hidden" name="address" value="{{ patient.address or '' }}">

                    <div class="form-group">
                        <label for="old_password"><i class="fas fa-key"></i> Old Password</label>
                        <input type="password" name="old_password" id="old_password" placeholder="Enter current password">
                    </div>

                    <div class="form-group">
                        <label for="new_password"><i class="fas fa-lock"></i> New Password</label>
                        <input type="password" name="new_password" id="new_password" placeholder="Enter new password" minlength="6">
                    </div>

                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-sync-alt"></i> Update Password
                    </button>
                    <p class="text-muted mt-2"><small>* Leave blank if you only want to update profile details.</small></p>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .settings-form {
        background: var(--white, #fff);
        padding: 2rem;
        border-radius: var(--radius, 8px);
        box-shadow: var(--shadow, 0 2px 10px rgba(0,0,0,0.05));
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--gray-700, #555);
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
    }
    .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--primary-color, #007bff);
    }
    .text-muted { color: #888; }
    .mt-2 { margin-top: 0.5rem; }
    
    @media (max-width: 768px) {
        .form-row { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}
