{% extends "base.html" %}

{% block title %}Hospital Information - MediCare Hospital{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-hospital-alt"></i> Hospital Information</h1>
        <p>These details are shown on the public website.</p>
    </div>

    <div class="dashboard-section">
        <form method="POST" action="{{ url_for('admin_hospital_info') }}" class="settings-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name"><i class="fas fa-hospital"></i> Hospital Name</label>
                    <input type="text" name="name" id="name" value="{{ hospital.name or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="tagline"><i class="fas fa-quote-left"></i> Tagline</label>
                    <input type="text" name="tagline" id="tagline" value="{{ hospital.tagline or '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Phone</label>
                    <input type="text" name="phone" id="phone" value="{{ hospital.phone or '' }}">
                </div>
                <div class="form-group">
                    <label for="emergency_phone"><i class="fas fa-truck-medical"></i> Emergency Phone</label>
                    <input type="text" name="emergency_phone" id="emergency_phone" value="{{ hospital.emergency_phone or '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" name="email" id="email" value="{{ hospital.email or '' }}">
                </div>
                <div class="form-group">
                    <label for="opening_hours"><i class="fas fa-clock"></i> Opening Hours</label>
                    <input type="text" name="opening_hours" id="opening_hours" value="{{ hospital.opening_hours or '' }}">
                </div>
            </div>

            <div class="form-group">
                <label for="address"><i class="fas fa-map-marker-alt"></i> Address</label>
                <input type="text" name="address" id="address" value="{{ hospital.address or '' }}">
            </div>

            <div class="form-group">
                <label for="about"><i class="fas fa-align-left"></i> About</label>
                <textarea name="about" id="about" rows="4">{{ hospital.about or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Information
            </button>
        </form>
    </div>
</div>
{% endblock %}
