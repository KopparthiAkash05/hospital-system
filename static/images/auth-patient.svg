<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Patient care illustration">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f766e"/>
            <stop offset="0.55" stop-color="#0e7490"/>
            <stop offset="1" stop-color="#1e3a8a"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.2" cy="0.15" r="0.85">
            <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="emblem" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
            <stop offset="1" stop-color="#ccfbf1" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <rect width="900" height="1200" fill="url(#bg)"/>
    <rect width="900" height="1200" fill="url(#glow)"/>

    <circle cx="740" cy="200" r="260" fill="#ffffff" opacity="0.05"/>
